name: BharatMarket CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, redesign/web-terminal]

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  backend:
    name: Backend syntax and candle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile api_server.py upstox_integration/live/live_feed_service.py upstox_integration/live/streaming_candle_engine.py upstox_integration/live/indicator_engine.py tests/test_streaming_candle_engine.py
      - run: python -m unittest tests.test_streaming_candle_engine -v
